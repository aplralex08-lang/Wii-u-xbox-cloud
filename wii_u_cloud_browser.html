<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wii U Cloud Browser</title>
<style type="text/css">
body {
  margin: 0;
  padding: 18px;
  background: #101827;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
}
.panel {
  max-width: 700px;
  margin: 25px auto;
  padding: 22px;
  background: #1c2b42;
  border: 2px solid #3b82f6;
}
h1 { color: #70b7ff; font-size: 28px; }
p { font-size: 18px; line-height: 1.5; }
button {
  display: block;
  width: 90%;
  max-width: 420px;
  margin: 22px auto;
  padding: 18px;
  color: #ffffff;
  background: #1769d2;
  border: 0;
  font-size: 22px;
}
button:disabled { background: #555555; }
#status { color: #ffd166; font-size: 16px; }
#screen {
  display: none;
  width: 100%;
  height: 360px;
  background: #000000;
  border: 1px solid #777777;
}
.small { color: #b9c7d8; font-size: 13px; }
</style>
</head>
<body>
<div class="panel">
  <h1>Wii U Cloud Browser</h1>
  <p>Un navegador remoto pensado para Nintendo Wii U.</p>
  <button id="start" onclick="startBrowser()">INICIAR NAVEGADOR</button>
  <p id="status">Estado: esperando conexión con el servidor.</p>
  <video id="screen" controls autoplay></video>
  <p class="small">
    Esta es la interfaz inicial. Para mostrar Chromium hace falta conectar
    un servidor remoto compatible. Todavía no hay un servidor configurado.
  </p>
</div>
<script type="text/javascript">
function startBrowser() {
  document.getElementById("status").innerHTML =
    "La interfaz funciona. Falta configurar la dirección del servidor remoto.";
}
</script>
</body>
</html>
